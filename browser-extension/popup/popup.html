<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DopamiNah</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="header-title">
        <h1>DopamiNah</h1>
        <span class="subtitle">Control de navegación</span>
      </div>
      <button id="reload-btn" class="btn btn-secondary btn-small" title="Recargar" style="padding: 4px 6px;">
        <svg viewBox="0 0 24 24" style="width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
      </button>
    </header>

    <!-- Current Tab Quick Action Panel -->
    <section id="current-tab-section" class="card">
      <h2>Pestaña Actual</h2>
      <div class="tab-info">
        <div class="tab-domain-wrapper">
          <span id="current-domain" class="tab-domain">Cargando...</span>
          <span id="current-status" class="tab-status">Detectando sitio...</span>
        </div>
        <div class="tab-time-container">
          <div id="current-time-spent" class="tab-time">-- min</div>
          <div class="tab-time-label">Hoy</div>
        </div>
      </div>
      <div class="tab-actions">
        <button id="quick-action-btn" class="btn btn-primary btn-small">Configurar Límite</button>
      </div>
    </section>

    <!-- Goals Section -->
    <section id="goals-section">
      <div class="section-header">
        <h2>Mis Metas</h2>
      </div>
      <div id="goals-list"></div>
      <div id="empty-state" class="empty-state">
        <p>No hay metas. Crea una para empezar.</p>
      </div>
      <div class="goals-footer" style="margin-top: 10px;">
        <button id="add-goal-btn" class="btn btn-primary" style="width: 100%;">+ Nueva Meta</button>
      </div>
    </section>

    <!-- Add Goal Form (Inline Expandable Card) -->
    <section id="add-goal-form" class="card hidden">
      <h2>Nueva meta</h2>
      <div class="form-group">
        <label for="goal-url">URL o dominio</label>
        <input type="text" id="goal-url" placeholder="ej. youtube.com">
      </div>
      <div class="form-group">
        <label>Tiempo límite</label>
        <div class="presets">
          <button class="preset-btn" data-minutes="15">15 min</button>
          <button class="preset-btn" data-minutes="30">30 min</button>
          <button class="preset-btn" data-minutes="60">1 hora</button>
          <button class="preset-btn" data-minutes="120">2 horas</button>
          <button class="preset-btn" data-minutes="180">3 horas</button>
          <button class="preset-btn active" data-minutes="0">Inmediato</button>
        </div>
        <div class="custom-time">
          <input type="number" id="custom-minutes" min="1" placeholder="Personalizado (min)">
        </div>
      </div>
      <div class="form-actions">
        <button id="cancel-goal-btn" class="btn btn-secondary btn-small">Cancelar</button>
        <button id="save-goal-btn" class="btn btn-primary btn-small">Guardar</button>
      </div>
    </section>
    <footer>
      <button id="sync-btn" class="btn btn-secondary">Sincronizar con DopamiNah web</button>
      <div id="sync-status" class="sync-status hidden">
        <svg class="success-icon" viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span id="sync-time-text">Sincronizado hoy</span>
      </div>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
