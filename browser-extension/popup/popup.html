<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DopamiNah</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>DopamiNah</h1>
      <span class="subtitle">Control de navegacion</span>
    </header>

    <section id="goals-section">
      <div class="section-header">
        <h2>Metas</h2>
        <button id="add-goal-btn" class="btn-primary">+ Nueva</button>
      </div>
      <div id="goals-list"></div>
      <div id="empty-state" class="empty-state">
        <p>No hay metas. Crea una para empezar.</p>
      </div>
    </section>

    <section id="add-goal-form" class="hidden">
      <h2>Nueva meta</h2>
      <div class="form-group">
        <label for="goal-url">URL o dominio</label>
        <input type="text" id="goal-url" placeholder="ej. youtube.com">
      </div>
      <div class="form-group">
        <label>Tiempo limite</label>
        <div class="presets">
          <button class="preset-btn" data-minutes="15">15 min</button>
          <button class="preset-btn" data-minutes="30">30 min</button>
          <button class="preset-btn" data-minutes="60">1 hora</button>
          <button class="preset-btn" data-minutes="120">2 horas</button>
          <button class="preset-btn" data-minutes="180">3 horas</button>
          <button class="preset-btn active" data-minutes="0">Inmediato</button>
        </div>
        <div class="custom-time">
          <input type="number" id="custom-minutes" min="1" placeholder="Personalizado (min)">
        </div>
      </div>
      <div class="form-actions">
        <button id="cancel-goal-btn" class="btn-secondary">Cancelar</button>
        <button id="save-goal-btn" class="btn-primary">Guardar</button>
      </div>
    </section>

    <footer>
      <button id="sync-btn" class="btn-secondary">Sincronizar con DopamiNah web</button>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
